<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0B1120" />
    <title>Page Not Found | Desire E</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh; margin: 0; display: grid; place-items: center;
        padding: 2rem; background: #0B1120; color: #fff; text-align: center;
      }
      main { max-width: 34rem; }
      .code { color: #c08497; font-size: .8rem; font-weight: 700; letter-spacing: .2em; }
      h1 { margin: 1rem 0; font-size: clamp(2.5rem, 8vw, 4rem); line-height: 1.1; }
      p { color: #aab4c5; line-height: 1.7; }
      a {
        display: inline-block; margin-top: 1rem; padding: .85rem 1.25rem;
        border-radius: .6rem; background: #c08497; color: #0B1120;
        font-weight: 700; text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 ERROR</p>
      <h1>Page not found</h1>
      <p>The page may have moved, or the address may be incorrect.</p>
      <a href="/">Return to homepage</a>
    </main>
  </body>
</html>
